<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InstaClone - Red Social</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.development.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.development.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.22.9/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios@1.6.8/dist/axios.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jwt-decode@3.1.2/build/jwt-decode.min.js"></script>
</head>
<body class="bg-gray-50 font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const API_URL = 'https://backend-uvig-production.up.railway.app/api';

    const Post = ({ username, image, caption, timestamp, likes, onProfileClick, token, postId }) => {
      const [likeCount, setLikeCount] = useState(likes);
      const [isLiked, setIsLiked] = useState(false);

      const handleLike = async () => {
        try {
          setLikeCount(isLiked ? likeCount - 1 : likeCount + 1);
          setIsLiked(!isLiked);
        } catch (error) {
          console.error('Error al dar like:', error);
        }
      };

      return (
        <div className="bg-white border rounded-lg mb-4 max-w-lg mx-auto">
          <div className="flex items-center p-3">
            <button onClick={() => onProfileClick(username)} className="flex items-center">
              <div className="w-10 h-10 bg-gradient-to-tr from-pink-500 via-red-500 to-yellow-500 rounded-full flex items-center justify-center">
                <div className="w-9 h-9 bg-white rounded-full flex items-center justify-center text-gray-800 font-bold">
                  {username[0].toUpperCase()}
                </div>
              </div>
              <p className="ml-3 font-semibold">{username}</p>
            </button>
          </div>
          <img src={image} alt="Post" className="w-full h-auto object-cover" onError={(e) => e.target.src = 'https://via.placeholder.com/500'} />
          <div className="p-3">
            <div className="flex items-center mb-2">
              <button onClick={handleLike} className="mr-3">
                <svg
                  className={`w-6 h-6 ${isLiked ? 'text-red-500 fill-current' : 'text-gray-800'}`}
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    strokeLinecap="round"
                    strokeLinejoin="round"
                    strokeWidth="2"
                    d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"
                  />
                </svg>
              </button>
              <p className="text-sm">{likeCount} Me gusta</p>
            </div>
            <p className="text-sm">
              <span className="font-semibold">{username}</span> {caption}
            </p>
            <p className="text-gray-500 text-xs mt-1">{new Date(timestamp).toLocaleString()}</p>
          </div>
        </div>
      );
    };

    const Reel = ({ username, videoUrl, caption, textOverlay, musicUrl, likes, timestamp, reelId, onProfileClick, token }) => {
      const [likeCount, setLikeCount] = useState(likes);
      const [isLiked, setIsLiked] = useState(false);
      const [comments, setComments] = useState([]);
      const [newComment, setNewComment] = useState('');
      const [error, setError] = useState('');
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        const fetchComments = async () => {
          try {
            setLoading(true);
            const response = await axios.get(`${API_URL}/reels/${reelId}/comments`, {
              headers: { Authorization: `Bearer ${token}` }
            });
            setComments(response.data);
            setError('');
          } catch (error) {
            console.error('Error al obtener comentarios del reel:', error);
            setError(error.response?.data?.message || 'Error al cargar comentarios');
          } finally {
            setLoading(false);
          }
        };
        fetchComments();
      }, [reelId, token]);

      const handleLike = async () => {
        try {
          setLikeCount(isLiked ? likeCount - 1 : likeCount + 1);
          setIsLiked(!isLiked);
        } catch (error) {
          console.error('Error al dar like al reel:', error);
        }
      };

      const handleComment = async (e) => {
        e.preventDefault();
        if (!newComment.trim()) return;
        try {
          await axios.post(
            `${API_URL}/reels/${reelId}/comments`,
            { comment: newComment },
            { headers: { Authorization: `Bearer ${token}` } }
          );
          setComments([{ username, comment: newComment, created_at: new Date().toISOString() }, ...comments]);
          setNewComment('');
          setError('');
        } catch (error) {
          console.error('Error al comentar:', error);
          setError(error.response?.data?.message || 'Error al añadir comentario');
        }
      };

      return (
        <div className="bg-white border rounded-lg mb-4 max-w-lg mx-auto">
          <div className="flex items-center p-3">
            <button onClick={() => onProfileClick(username)} className="flex items-center">
              <div className="w-10 h-10 bg-gradient-to-tr from-pink-500 via-red-500 to-yellow-500 rounded-full flex items-center justify-center">
                <div className="w-9 h-9 bg-white rounded-full flex items-center justify-center text-gray-800 font-bold">
                  {username[0].toUpperCase()}
                </div>
              </div>
              <p className="ml-3 font-semibold">{username}</p>
            </button>
          </div>
          <div className="relative">
            <video controls className="w-full h-auto" onError={(e) => console.error('Error al cargar video:', videoUrl)}>
              <source src={videoUrl} type="video/mp4" />
              Tu navegador no soporta videos.
            </video>
            {textOverlay && (
              <div className="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 text-white text-lg font-bold bg-black bg-opacity-50 p-2 rounded">
                {textOverlay}
              </div>
            )}
            {musicUrl && (
              <div className="absolute bottom-4 right-4 text-white text-sm bg-black bg-opacity-50 p-1 rounded">
                🎵 Música: <a href={musicUrl} target="_blank" rel="noopener noreferrer" className="underline">YouTube</a>
              </div>
            )}
          </div>
          <div className="p-3">
            {loading && <p className="text-gray-500 text-sm mb-2">Cargando comentarios...</p>}
            {error && <p className="text-red-500 text-sm mb-2">{error}</p>}
            <div className="flex items-center mb-2">
              <button onClick={handleLike} className="mr-3">
                <svg
                  className={`w-6 h-6 ${isLiked ? 'text-red-500 fill-current' : 'text-gray-800'}`}
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    strokeLinecap="round"
                    strokeLinejoin="round"
                    strokeWidth="2"
                    d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"
                  />
                </svg>
              </button>
              <p className="text-sm">{likeCount} Me gusta</p>
            </div>
            <p className="text-sm">
              <span className="font-semibold">{username}</span> {caption}
            </p>
            <p className="text-gray-500 text-xs mt-1">{new Date(timestamp).toLocaleString()}</p>
            <div className="mt-2">
              <h4 className="font-semibold text-sm">Comentarios</h4>
              {comments.length === 0 && !loading && <p className="text-gray-600 text-sm">No hay comentarios aún</p>}
              {comments.map((c, index) => (
                <p key={index} className="text-sm">
                  <span className="font-semibold">{c.username}</span> {c.comment}
                </p>
              ))}
              <form onSubmit={handleComment} className="flex mt-2">
                <input
                  type="text"
                  value={newComment}
                  onChange={(e) => setNewComment(e.target.value)}
                  placeholder="Añadir un comentario..."
                  className="flex-1 p-2 border rounded-l-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                />
                <button type="submit" className="bg-blue-500 text-white px-4 py-2 rounded-r-lg hover:bg-blue-600">
                  Enviar
                </button>
              </form>
            </div>
          </div>
        </div>
      );
    };

    const RegisterForm = ({ onSwitchToLogin, setToken }) => {
      const [username, setUsername] = useState('');
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [error, setError] = useState('');

      const handleSubmit = async (e) => {
        e.preventDefault();
        try {
          const response = await axios.post(`${API_URL}/auth/register`, {
            username,
            email,
            password
          });
          setToken(response.data.token);
          setError('');
        } catch (error) {
          console.error('Error al registrarse:', error);
          setError(error.response?.data?.message || 'Error al registrarse');
        }
      };

      return (
        <div className="max-w-lg mx-auto p-4">
          <h2 className="text-2xl font-bold mb-4 text-center">Registrarse</h2>
          {error && <p className="text-red-500 mb-4">{error}</p>}
          <div className="bg-white border rounded-lg p-4">
            <input
              type="text"
              placeholder="Nombre de usuario"
              value={username}
              onChange={(e) => setUsername(e.target.value)}
              className="w-full p-2 border rounded-lg mb-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
            <input
              type="email"
              placeholder="Correo electrónico"
              value={email}
              onChange={(e) => setEmail(e.target.value)}
              className="w-full p-2 border rounded-lg mb-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
            <input
              type="password"
              placeholder="Contraseña"
              value={password}
              onChange={(e) => setPassword(e.target.value)}
              className="w-full p-2 border rounded-lg mb-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
            <button
              onClick={handleSubmit}
              className="w-full bg-blue-500 text-white py-2 rounded-lg hover:bg-blue-600"
            >
              Registrarse
            </button>
            <p className="text-center mt-4">
              ¿Ya tienes cuenta?{' '}
              <button onClick={onSwitchToLogin} className="text-blue-500 hover:underline">
                Inicia sesión
              </button>
            </p>
          </div>
        </div>
      );
    };

    const LoginForm = ({ onSwitchToRegister, setToken }) => {
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [error, setError] = useState('');

      const handleSubmit = async (e) => {
        e.preventDefault();
        try {
          const response = await axios.post(`${API_URL}/auth/login`, {
            email,
            password
          });
          setToken(response.data.token);
          setError('');
        } catch (error) {
          console.error('Error al iniciar sesión:', error);
          setError(error.response?.data?.message || 'Error al iniciar sesión');
        }
      };

      return (
        <div className="max-w-lg mx-auto p-4">
          <h2 className="text-2xl font-bold mb-4 text-center">Iniciar Sesión</h2>
          {error && <p className="text-red-500 mb-4">{error}</p>}
          <div className="bg-white border rounded-lg p-4">
            <input
              type="email"
              placeholder="Correo electrónico"
              value={email}
              onChange={(e) => setEmail(e.target.value)}
              className="w-full p-2 border rounded-lg mb-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
            <input
              type="password"
              placeholder="Contraseña"
              value={password}
              onChange={(e) => setPassword(e.target.value)}
              className="w-full p-2 border rounded-lg mb-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
            <button
              onClick={handleSubmit}
              className="w-full bg-blue-500 text-white py-2 rounded-lg hover:bg-blue-600"
            >
              Iniciar Sesión
            </button>
            <p className="text-center mt-4">
              ¿No tienes cuenta?{' '}
              <button onClick={onSwitchToRegister} className="text-blue-500 hover:underline">
                Regístrate
              </button>
            </p>
          </div>
        </div>
      );
    };

    const PostForm = ({ onPost, onClose, token }) => {
      const [caption, setCaption] = useState('');
      const [image, setImage] = useState('');
      const [error, setError] = useState('');

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!caption.trim() || !image.trim()) {
          setError('Por favor completa todos los campos');
          return;
        }
        try {
          await axios.post(
            `${API_URL}/posts`,
            { caption, image_url: image },
            { headers: { Authorization: `Bearer ${token}` } }
          );
          setCaption('');
          setImage('');
          setError('');
          onPost();
          onClose();
        } catch (error) {
          console.error('Error al crear publicación:', error);
          setError(error.response?.data?.message || 'Error al crear publicación');
        }
      };

      return (
        <div className="bg-white border rounded-lg p-4 max-w-lg mx-auto">
          <div className="flex justify-between items-center mb-3">
            <h2 className="text-lg font-semibold">Nueva Publicación</h2>
            <button onClick={onClose} className="text-gray-600 hover:text-gray-800">
              <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12" />
              </svg>
            </button>
          </div>
          {error && <p className="text-red-500 mb-2">{error}</p>}
          <input
            type="text"
            placeholder="URL de la imagen (ej. https://picsum.photos/500)"
            value={image}
            onChange={(e) => setImage(e.target.value)}
            className="w-full p-2 border rounded-lg mb-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
          <textarea
            placeholder="Escribe una descripción..."
            value={caption}
            onChange={(e) => setCaption(e.target.value)}
            className="w-full p-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
            rows="3"
          ></textarea>
          <button
            onClick={handleSubmit}
            className="mt-3 bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600 w-full"
          >
            Publicar
          </button>
        </div>
      );
    };

    const ReelForm = ({ onReel, onClose, token }) => {
      const [caption, setCaption] = useState('');
      const [file, setFile] = useState(null);
      const [textOverlay, setTextOverlay] = useState('');
      const [musicUrl, setMusicUrl] = useState('');
      const [preview, setPreview] = useState(null);
      const [error, setError] = useState('');

      const handleFileChange = (e) => {
        const selectedFile = e.target.files[0];
        if (selectedFile) {
          if (selectedFile.size > 50 * 1024 * 1024) {
            setError('El archivo excede el límite de 50MB');
            return;
          }
          setFile(selectedFile);
          setPreview(URL.createObjectURL(selectedFile));
          setError('');
        }
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!file) {
          setError('Por favor selecciona un video');
          return;
        }
        const formData = new FormData();
        formData.append('video', file);
        formData.append('caption', caption);
        formData.append('text_overlay', textOverlay);
        formData.append('music_url', musicUrl);

        try {
          const response = await axios.post(`${API_URL}/reels`, formData, {
            headers: {
              Authorization: `Bearer ${token}`,
              'Content-Type': 'multipart/form-data'
            }
          });
          setCaption('');
          setFile(null);
          setTextOverlay('');
          setMusicUrl('');
          setPreview(null);
          setError('');
          onReel();
          onClose();
        } catch (error) {
          console.error('Error al crear reel:', error);
          setError(error.response?.data?.message || 'Error al crear reel');
        }
      };

      return (
        <div className="bg-white border rounded-lg p-4 max-w-lg mx-auto">
          <div className="flex justify-between items-center mb-3">
            <h2 className="text-lg font-semibold">Nuevo Reel</h2>
            <button onClick={onClose} className="text-gray-600 hover:text-gray-800">
              <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12" />
              </svg>
            </button>
          </div>
          {error && <p className="text-red-500 mb-2">{error}</p>}
          <input
            type="file"
            accept="video/mp4"
            onChange={handleFileChange}
            className="w-full p-2 border rounded-lg mb-2"
          />
          {preview && (
            <div className="mb-2">
              <video controls className="w-full h-auto">
                <source src={preview} type="video/mp4" />
                Tu navegador no soporta videos.
              </video>
            </div>
          )}
          <textarea
            placeholder="Escribe una descripción..."
            value={caption}
            onChange={(e) => setCaption(e.target.value)}
            className="w-full p-2 border rounded-lg mb-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
            rows="3"
          ></textarea>
          <input
            type="text"
            placeholder="Texto para superponer en el video"
            value={textOverlay}
            onChange={(e) => setTextOverlay(e.target.value)}
            className="w-full p-2 border rounded-lg mb-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
          <input
            type="url"
            placeholder="Enlace de YouTube para música (ej. https://youtu.be/...)"
            value={musicUrl}
            onChange={(e) => setMusicUrl(e.target.value)}
            className="w-full p-2 border rounded-lg mb-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
          <button
            onClick={handleSubmit}
            className="mt-3 bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600 w-full"
          >
            Publicar Reel
          </button>
        </div>
      );
    };

    const Settings = ({ onBack, token, username, onProfileUpdate }) => {
      const [file, setFile] = useState(null);
      const [preview, setPreview] = useState(null);
      const [error, setError] = useState('');

      const handleFileChange = (e) => {
        const selectedFile = e.target.files[0];
        if (selectedFile) {
          if (selectedFile.size > 5 * 1024 * 1024) {
            setError('La imagen excede el límite de 5MB');
            return;
          }
          setFile(selectedFile);
          setPreview(URL.createObjectURL(selectedFile));
          setError('');
        }
      };

      const handleUpload = async () => {
        if (!file) {
          setError('Por favor selecciona una imagen');
          return;
        }
        const formData = new FormData();
        formData.append('image', file);
        try {
          const response = await axios.post(`${API_URL}/users/profile-picture`, formData, {
            headers: {
              Authorization: `Bearer ${token}`,
              'Content-Type': 'multipart/form-data'
            }
          });
          setFile(null);
          setPreview(null);
          setError('');
          onProfileUpdate(response.data.imageUrl);
        } catch (error) {
          console.error('Error al subir foto de perfil:', error);
          setError(error.response?.data?.message || 'Error al subir foto de perfil');
        }
      };

      return (
        <div className="pt-16 pb-16 max-w-lg mx-auto">
          <button onClick={onBack} className="mb-4 text-blue-500 flex items-center">
            <svg className="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 19l-7-7 7-7" />
            </svg>
            Volver
          </button>
          <div className="bg-white border rounded-lg p-4">
            <h2 className="text-lg font-semibold mb-4">Ajustes</h2>
            <h3 className="text-md font-semibold mb-2">Actualizar Foto de Perfil</h3>
            {error && <p className="text-red-500 mb-2">{error}</p>}
            <input
              type="file"
              accept="image/jpeg,image/png"
              onChange={handleFileChange}
              className="w-full p-2 border rounded-lg mb-2"
            />
            {preview && (
              <div className="mb-2">
                <img src={preview} alt="Preview" className="w-32 h-32 rounded-full object-cover" />
              </div>
            )}
            <button
              onClick={handleUpload}
              disabled={!file}
              className={`w-full py-2 rounded-lg ${file ? 'bg-blue-500 text-white hover:bg-blue-600' : 'bg-gray-300 text-gray-600 cursor-not-allowed'}`}
            >
              Subir Foto
            </button>
          </div>
        </div>
      );
    };

    const Profile = ({ username, posts, reels, onBack, onProfileClick, token, isOwnProfile, onSettingsClick }) => {
      const [isFollowing, setIsFollowing] = useState(false);
      const [profilePic, setProfilePic] = useState(null);
      const [followers, setFollowers] = useState(0);
      const [following, setFollowing] = useState(0);
      const [error, setError] = useState('');
      const [loading, setLoading] = useState(true);
      const userPosts = posts.filter(post => post.username === username);
      const userReels = reels.filter(reel => reel.username === username);

      useEffect(() => {
        const fetchProfileData = async () => {
          try {
            setLoading(true);
            console.log(`Cargando datos del perfil para: ${username}`);
            const [picResponse, followResponse] = await Promise.all([
              axios.get(`${API_URL}/users/${username}/profile-picture`, {
                headers: { Authorization: `Bearer ${token}` }
              }),
              axios.get(`${API_URL}/users/${username}/followers`, {
                headers: { Authorization: `Bearer ${token}` }
              })
            ]);
            setProfilePic(picResponse.data.imageUrl);
            setFollowers(followResponse.data.followers);
            setFollowing(followResponse.data.following);
            setError('');
          } catch (error) {
            console.error('Error al obtener datos del perfil:', error);
            setError(error.response?.data?.message || 'Error al cargar el perfil');
          } finally {
            setLoading(false);
          }
        };
        if (username) {
          fetchProfileData();
        } else {
          setError('No se proporcionó un nombre de usuario');
          setLoading(false);
        }
      }, [username, token]);

      const handleFollow = async () => {
        try {
          await axios.post(`${API_URL}/users/${username}/follow`, {}, {
            headers: { Authorization: `Bearer ${token}` }
          });
          setIsFollowing(!isFollowing);
          setFollowers(prev => isFollowing ? prev - 1 : prev + 1);
        } catch (error) {
          console.error('Error al seguir/deseguir:', error);
          setError(error.response?.data?.message || 'Error al seguir/deseguir');
        }
      };

      const handleProfileUpdate = (newImageUrl) => {
        setProfilePic(newImageUrl);
      };

      if (loading) {
        return (
          <div className="pt-16 pb-16 max-w-lg mx-auto text-center">
            <p className="text-gray-500">Cargando perfil...</p>
          </div>
        );
      }

      if (error) {
        return (
          <div className="pt-16 pb-16 max-w-lg mx-auto">
            <button onClick={onBack} className="mb-4 text-blue-500 flex items-center">
              <svg className="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 19l-7-7 7-7" />
              </svg>
              Volver
            </button>
            <p className="text-red-500 text-center">{error}</p>
          </div>
        );
      }

      return (
        <div className="pt-16 pb-16 max-w-lg mx-auto">
          <div className="flex justify-between items-center mb-4">
            <button onClick={onBack} className="text-blue-500 flex items-center">
              <svg className="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 19l-7-7 7-7" />
              </svg>
              Volver
            </button>
            {isOwnProfile && (
              <button onClick={onSettingsClick} className="text-gray-600 hover:text-gray-800">
                <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
              </button>
            )}
          </div>
          <div className="bg-white border rounded-lg p-4 mb-4">
            <div className="flex items-center mb-4">
              <div className="w-20 h-20 rounded-full overflow-hidden">
                {profilePic ? (
                  <img src={profilePic} alt="Profile" className="w-full h-full object-cover" onError={(e) => e.target.src = 'https://via.placeholder.com/150'} />
                ) : (
                  <div className="w-full h-full bg-gradient-to-tr from-pink-500 via-red-500 to-yellow-500 flex items-center justify-center">
                    <div className="w-18 h-18 bg-white rounded-full flex items-center justify-center text-gray-800 font-bold text-2xl">
                      {username[0].toUpperCase()}
                    </div>
                  </div>
                )}
              </div>
              <div className="ml-4 flex-1">
                <p className="font-semibold text-lg">{username}</p>
                <div className="flex space-x-4 mt-2">
                  <p className="text-sm"><span className="font-semibold">{userPosts.length}</span> Publicaciones</p>
                  <p className="text-sm"><span className="font-semibold">{followers}</span> Seguidores</p>
                  <p className="text-sm"><span className="font-semibold">{following}</span> Seguidos</p>
                </div>
              </div>
            </div>
            {!isOwnProfile && (
              <button
                onClick={handleFollow}
                className={`w-full py-2 rounded-lg ${isFollowing ? 'bg-gray-200 text-gray-800' : 'bg-blue-500 text-white'} hover:opacity-90`}
              >
                {isFollowing ? 'Dejar de seguir' : 'Seguir'}
              </button>
            )}
          </div>
          <div className="space-y-4">
            {userPosts.length === 0 && userReels.length === 0 && (
              <p className="text-gray-600 text-center">No hay publicaciones ni reels</p>
            )}
            {userPosts.map((post, index) => (
              <Post
                key={index}
                username={post.username}
                image={post.image_url}
                caption={post.caption}
                timestamp={post.created_at}
                likes={post.likes}
                onProfileClick={onProfileClick}
                token={token}
                postId={post.id}
              />
            ))}
            {userReels.map((reel, index) => (
              <Reel
                key={index}
                username={reel.username}
                videoUrl={reel.video_url}
                caption={reel.caption}
                textOverlay={reel.text_overlay}
                musicUrl={reel.music_url}
                likes={reel.likes}
                timestamp={reel.created_at}
                reelId={reel.id}
                onProfileClick={onProfileClick}
                token={token}
              />
            ))}
          </div>
        </div>
      );
    };

    const Search = ({ onBack, onProfileClick, token }) => {
      const [query, setQuery] = useState('');
      const [results, setResults] = useState([]);
      const [error, setError] = useState('');
      const [loading, setLoading] = useState(false);

      useEffect(() => {
        if (query.trim()) {
          const fetchResults = async () => {
            try {
              setLoading(true);
              const response = await axios.get(`${API_URL}/users/search?query=${query}`, {
                headers: { Authorization: `Bearer ${token}` }
              });
              setResults(response.data);
              setError('');
            } catch (error) {
              console.error('Error al buscar usuarios:', error);
              setError(error.response?.data?.message || 'Error al buscar usuarios');
            } finally {
              setLoading(false);
            }
          };
          fetchResults();
        } else {
          setResults([]);
          setLoading(false);
        }
      }, [query, token]);

      return (
        <div className="pt-16 pb-16 max-w-lg mx-auto">
          <button onClick={onBack} className="mb-4 text-blue-500 flex items-center">
            <svg className="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 19l-7-7 7-7" />
            </svg>
            Volver
          </button>
          <div className="bg-white border rounded-lg p-4">
            <input
              type="text"
              placeholder="Buscar usuarios..."
              value={query}
              onChange={(e) => setQuery(e.target.value)}
              className="w-full p-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
            {loading && <p className="text-gray-500 mt-2">Buscando...</p>}
            {error && <p className="text-red-500 mt-2">{error}</p>}
            <div className="mt-4">
              {results.map((user, index) => (
                <button
                  key={index}
                  onClick={() => onProfileClick(user.username)}
                  className="block w-full text-left p-2 hover:bg-gray-100 rounded"
                >
                  {user.username}
                </button>
              ))}
              {results.length === 0 && query && !loading && (
                <p className="text-gray-600">No se encontraron usuarios</p>
              )}
            </div>
          </div>
        </div>
      );
    };

    const Messages = ({ onBack, token, currentUser }) => {
      const [messages, setMessages] = useState([]);
      const [receiver, setReceiver] = useState('');
      const [content, setContent] = useState('');
      const [error, setError] = useState('');
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        const fetchMessages = async () => {
          try {
            setLoading(true);
            console.log('Obteniendo mensajes...');
            const response = await axios.get(`${API_URL}/messages`, {
              headers: { Authorization: `Bearer ${token}` }
            });
            setMessages(response.data);
            setError('');
          } catch (error) {
            console.error('Error al obtener mensajes:', error);
            setError(error.response?.data?.message || 'Error al cargar mensajes');
          } finally {
            setLoading(false);
          }
        };
        fetchMessages();
      }, [token]);

      const handleSend = async (e) => {
        e.preventDefault();
        if (!receiver.trim() || !content.trim()) {
          setError('Por favor completa todos los campos');
          return;
        }
        try {
          await axios.post(
            `${API_URL}/messages`,
            { receiver_username: receiver, content },
            { headers: { Authorization: `Bearer ${token}` } }
          );
          setMessages([{ sender: currentUser, receiver, content, created_at: new Date().toISOString() }, ...messages]);
          setContent('');
          setError('');
        } catch (error) {
          console.error('Error al enviar mensaje:', error);
          setError(error.response?.data?.message || 'Error al enviar mensaje');
        }
      };

      return (
        <div className="pt-16 pb-16 max-w-lg mx-auto">
          <button onClick={onBack} className="mb-4 text-blue-500 flex items-center">
            <svg className="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 19l-7-7 7-7" />
            </svg>
            Volver
          </button>
          <div className="bg-white border rounded-lg p-4">
            <h2 className="font-semibold mb-4">Mensajes</h2>
            {loading && <p className="text-gray-500 mb-2">Cargando mensajes...</p>}
            {error && <p className="text-red-500 mb-2">{error}</p>}
            <div className="mb-4">
              <input
                type="text"
                placeholder="Nombre de usuario del destinatario"
                value={receiver}
                onChange={(e) => setReceiver(e.target.value)}
                className="w-full p-2 border rounded-lg mb-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
              />
              <textarea
                placeholder="Escribe tu mensaje..."
                value={content}
                onChange={(e) => setContent(e.target.value)}
                className="w-full p-2 border rounded-lg mb-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                rows="3"
              ></textarea>
              <button
                onClick={handleSend}
                className="w-full bg-blue-500 text-white py-2 rounded-lg hover:bg-blue-600"
              >
                Enviar
              </button>
            </div>
            {messages.length === 0 && !loading && <p className="text-gray-600">No hay mensajes</p>}
            <div className="space-y-2">
              {messages.map((msg, index) => (
                <div key={index} className="p-2 bg-gray-100 rounded-lg">
                  <p className="text-sm">
                    <span className="font-semibold">{msg.sender}</span> → <span className="font-semibold">{msg.receiver}</span>: {msg.content}
                  </p>
                  <p className="text-gray-500 text-xs">{new Date(msg.created_at).toLocaleString()}</p>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    };

    const Videos = ({ onBack, token, onProfileClick }) => {
      const [reels, setReels] = useState([]);
      const [error, setError] = useState('');
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        const fetchReels = async () => {
          try {
            setLoading(true);
            console.log('Obteniendo reels...');
            const response = await axios.get(`${API_URL}/reels`, {
              headers: { Authorization: `Bearer ${token}` }
            });
            setReels(response.data);
            setError('');
          } catch (error) {
            console.error('Error al obtener reels:', error);
            setError(error.response?.data?.message || 'Error al cargar reels');
          } finally {
            setLoading(false);
          }
        };
        fetchReels();
      }, [token]);

      return (
        <div className="pt-16 pb-16 max-w-lg mx-auto">
          <button onClick={onBack} className="mb-4 text-blue-500 flex items-center">
            <svg className="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 19l-7-7 7-7" />
            </svg>
            Volver
          </button>
          {loading && <p className="text-gray-500 mb-2">Cargando reels...</p>}
          {error && <p className="text-red-500 mb-2">{error}</p>}
          {reels.length === 0 && !loading && <p className="text-gray-600 text-center">No hay reels disponibles</p>}
          <div className="space-y-4">
            {reels.map((reel, index) => (
              <Reel
                key={index}
                username={reel.username}
                videoUrl={reel.video_url}
                caption={reel.caption}
                textOverlay={reel.text_overlay}
                musicUrl={reel.music_url}
                likes={reel.likes}
                timestamp={reel.created_at}
                reelId={reel.id}
                onProfileClick={onProfileClick}
                token={token}
              />
            ))}
          </div>
        </div>
      );
    };

    const App = () => {
      const [token, setToken] = useState(localStorage.getItem('token') || null);
      const [posts, setPosts] = useState([]);
      const [reels, setReels] = useState([]);
      const [view, setView] = useState(token ? 'feed' : 'login');
      const [selectedProfile, setSelectedProfile] = useState(null);
      const [currentUser, setCurrentUser] = useState(null);
      const [error, setError] = useState('');
      const [loading, setLoading] = useState(false);

      useEffect(() => {
        if (token) {
          localStorage.setItem('token', token);
          try {
            const decoded = jwt_decode(token);
            console.log('Usuario decodificado:', decoded);
            setCurrentUser(decoded.username);
            fetchPosts();
            fetchReels();
          } catch (error) {
            console.error('Error al decodificar token:', error);
            setError('Sesión inválida, por favor inicia sesión nuevamente');
            setToken(null);
            setView('login');
          }
        } else {
          localStorage.removeItem('token');
          setCurrentUser(null);
          setView('login');
        }
      }, [token]);

      const fetchPosts = async () => {
        try {
          setLoading(true);
          console.log('Obteniendo publicaciones...');
          const response = await axios.get(`${API_URL}/posts`, {
            headers: { Authorization: `Bearer ${token}` }
          });
          setPosts(response.data);
          setError('');
        } catch (error) {
          console.error('Error al obtener publicaciones:', error);
          setError(error.response?.data?.message || 'Error al cargar publicaciones');
        } finally {
          setLoading(false);
        }
      };

      const fetchReels = async () => {
        try {
          setLoading(true);
          console.log('Obteniendo reels...');
          const response = await axios.get(`${API_URL}/reels`, {
            headers: { Authorization: `Bearer ${token}` }
          });
          setReels(response.data);
          setError('');
        } catch (error) {
          console.error('Error al obtener reels:', error);
          setError(error.response?.data?.message || 'Error al cargar reels');
        } finally {
          setLoading(false);
        }
      };

      const handleProfileClick = (username) => {
        console.log(`Navegando al perfil de: ${username}`);
        setSelectedProfile(username);
        setView('profile');
      };

      const handleOwnProfileClick = () => {
        if (currentUser) {
          console.log(`Navegando al perfil propio: ${currentUser}`);
          setSelectedProfile(currentUser);
          setView('profile');
        } else {
          setError('No estás autenticado');
        }
      };

      const handleSettingsClick = () => {
        console.log('Navegando a ajustes');
        setView('settings');
      };

      const handleLogout = () => {
        console.log('Cerrando sesión');
        setToken(null);
        setCurrentUser(null);
        setSelectedProfile(null);
        setView('login');
      };

      const renderView = () => {
        switch (view) {
          case 'login':
            return <LoginForm onSwitchToRegister={() => setView('register')} setToken={setToken} />;
          case 'register':
            return <RegisterForm onSwitchToLogin={() => setView('login')} setToken={setToken} />;
          case 'feed':
            return (
              <div className="pt-16 pb-16 max-w-lg mx-auto">
                {loading && <p className="text-gray-500 text-center">Cargando publicaciones...</p>}
                {error && <p className="text-red-500 text-center mb-4">{error}</p>}
                {posts.length === 0 && !loading && <p className="text-gray-600 text-center">No hay publicaciones</p>}
                <div className="space-y-4">
                  {posts.map((post) => (
                    <Post
                      key={post.id}
                      postId={post.id}
                      username={post.username}
                      image={post.image_url}
                      caption={post.caption}
                      timestamp={post.created_at}
                      likes={post.likes}
                      onProfileClick={handleProfileClick}
                      token={token}
                    />
                  ))}
                </div>
              </div>
            );
          case 'postForm':
            return <PostForm onPost={fetchPosts} onClose={() => setView('feed')} token={token} />;
          case 'reelForm':
            return <ReelForm onReel={fetchReels} onClose={() => setView('videos')} token={token} />;
          case 'profile':
            return (
              <Profile
                username={selectedProfile}
                posts={posts}
                reels={reels}
                onBack={() => setView('feed')}
                onProfileClick={handleProfileClick}
                token={token}
                isOwnProfile={selectedProfile === currentUser}
                onSettingsClick={handleSettingsClick}
              />
            );
          case 'settings':
            return (
              <Settings
                onBack={() => setView('profile')}
                token={token}
                username={currentUser}
                onProfileUpdate={(imageUrl) => {
                  console.log('Foto de perfil actualizada:', imageUrl);
                  setView('profile');
                }}
              />
            );
          case 'search':
            return <Search onBack={() => setView('feed')} onProfileClick={handleProfileClick} token={token} />;
          case 'messages':
            return <Messages onBack={() => setView('feed')} token={token} currentUser={currentUser} />;
          case 'videos':
            return <Videos onBack={() => setView('feed')} onProfileClick={handleProfileClick} token={token} />;
          default:
            return <div className="pt-16 pb-16 max-w-lg mx-auto text-center">Vista no encontrada</div>;
        }
      };

      return (
        <div className="min-h-screen bg-gray-50">
          <header className="bg-white border-b p-3 fixed top-0 w-full z-10">
            <div className="max-w-lg mx-auto flex items-center justify-between">
              <h1 className="text-xl font-bold bg-gradient-to-r from-pink-500 via-red-500 to-yellow-500 bg-clip-text text-transparent">
                InstaClone
              </h1>
              <div className="flex space-x-4">
                {token ? (
                  <>
                    <button onClick={() => setView('postForm')} title="Nueva publicación">
                      <svg className="w-6 h-6 text-gray-800" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4" />
                      </svg>
                    </button>
                    <button onClick={() => setView('reelForm')} title="Nuevo reel">
                      <svg className="w-6 h-6 text-gray-800" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" />
                      </svg>
                    </button>
                    <button onClick={handleOwnProfileClick} title="Mi perfil">
                      <svg className="w-6 h-6 text-gray-800" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                      </svg>
                    </button>
                    <button onClick={handleLogout} title="Cerrar sesión">
                      <svg className="w-6 h-6 text-gray-800" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 16l4-4m0 0l-4-4m4 4H7m5 4v-7" />
                      </svg>
                    </button>
                  </>
                ) : (
                  <button onClick={() => setView('login')} title="Iniciar sesión">
                    <svg className="w-6 h-6 text-gray-800" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v-7" />
                    </svg>
                  </button>
                )}
              </div>
            </div>
          </header>
          {renderView()}
          {token && (
            <footer className="bg-white border-t p-3 fixed bottom-0 w-full">
              <div className="max-w-lg mx-auto flex justify-between">
                <button onClick={() => setView('feed')} title="Inicio">
                  <svg className={`w-6 h-6 ${view === 'feed' ? 'text-blue-500' : 'text-gray-800'}`} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                  </svg>
                </button>
                <button onClick={() => setView('search')} title="Buscar">
                  <svg className={`w-6 h-6 ${view === 'search' ? 'text-blue-500' : 'text-gray-800'}`} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                  </svg>
                </button>
                <button onClick={() => setView('postForm')} title="Nueva publicación">
                  <svg className={`w-6 h-6 ${view === 'postForm' ? 'text-blue-500' : 'text-gray-800'}`} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4" />
                  </svg>
                </button>
                <button onClick={() => setView('videos')} title="Reels">
                  <svg className={`w-6 h-6 ${view === 'videos' ? 'text-blue-500' : 'text-gray-800'}`} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" />
                  </svg>
                </button>
                <button onClick={() => setView('messages')} title="Mensajes">
                  <svg className={`w-6 h-6 ${view === 'messages' ? 'text-blue-500' : 'text-gray-800'}`} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
                  </svg>
                </button>
                <button onClick={handleOwnProfileClick} title="Mi perfil">
                  <svg className={`w-6 h-6 ${view === 'profile' && selectedProfile === currentUser ? 'text-blue-500' : 'text-gray-800'}`} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                  </svg>
                </button>
              </div>
            </footer>
          )}
        </div>
      );
    };

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
